name: ✅ Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.112'
  SOLUTION: 'Media.slnx'
  REGISTRY: ghcr.io
  IMAGE_OWNER: exploraprop
  IMAGE_NAME: media-api
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  unit:
    name: 🧪 Unit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: false
          source-url: https://nuget.pkg.github.com/ExploraProp/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: 📦 Restore local tools
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          dotnet nuget update source github-exploraprop --username github --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet tool restore

      # Unit does not need the ephemeral Kiota client; avoid building Functional here.
      - name: ⚙️ Restore
        run: dotnet restore tests/Unit/Media.Unit.csproj

      - name: 🔨 Build
        run: dotnet build tests/Unit/Media.Unit.csproj --configuration Release --no-restore

      - name: 🧪 Unit tests + coverage
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- test-unit --service-root .

      - name: 📊 Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: coverage-reports/*.opencover.xml
          retention-days: 1
          if-no-files-found: warn

  functional:
    name: 🧪 Functional
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: false
          source-url: https://nuget.pkg.github.com/ExploraProp/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: 🐳 Verify Docker
        run: docker info

      - name: 📦 Restore local tools
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          dotnet nuget update source github-exploraprop --username github --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet tool restore

      # OpenAPI generation boots Startup; secrets must be in env before generate-client.
      - name: 🔐 Configure secrets
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- secrets-ci --service Media --format github-env >> "$GITHUB_ENV"

      # clients/ is gitignored — scaffold + Kiota before solution restore/build.
      - name: 🧬 Generate API client
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          export MEDIA_WATERMARK_PATH="${GITHUB_WORKSPACE}/src/API/Assets/watermark.png"
          dotnet tool run api-scripts -- generate-client --service Media

      - name: ⚙️ Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: 🔨 Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: 🔐 Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: 🧪 Functional tests + coverage
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          SIBLING_IMAGE_TAG: main
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          export MEDIA_WATERMARK_PATH="${GITHUB_WORKSPACE}/src/API/Assets/watermark.png"
          dotnet tool run api-scripts -- test-functional --service-root .

      - name: 📊 Upload functional coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-coverage
          path: coverage-reports/*.opencover.xml
          retention-days: 1
          if-no-files-found: warn

  merge-coverage:
    name: 🧩 Merge Coverage
    runs-on: ubuntu-latest
    needs: [unit, functional]
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: false

      - name: 📦 Restore local tools
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          dotnet nuget update source github-exploraprop --username github --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet tool restore

      - name: 📥 Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-coverage'
          path: coverage-reports
          merge-multiple: true

      - name: 🧩 Merge coverage
        shell: bash
        env:
          OPENCOVER_LICENSE: ${{ secrets.OPENCOVER_LICENSE }}
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- merge-coverage --service-root .

      - name: 📤 Upload merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: merged-coverage
          path: coverage-reports/coverage.opencover.xml
          retention-days: 1

  sonar:
    name: 🔍 SonarCloud
    runs-on: ubuntu-latest
    needs: merge-coverage
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: write
    steps:
      - name: ⬇️ Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: 17
          distribution: zulu

      - name: ⬇️ Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: false
          source-url: https://nuget.pkg.github.com/ExploraProp/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: 📦 Cache Sonar packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 📦 Cache Sonar scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: 📦 Install Sonar scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: 📦 Restore local tools
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          dotnet nuget update source github-exploraprop --username github --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet tool restore

      - name: 🔐 Configure secrets
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- secrets-ci --service Media --format github-env >> "$GITHUB_ENV"

      - name: 🧬 Generate API client
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          export MEDIA_WATERMARK_PATH="${GITHUB_WORKSPACE}/src/API/Assets/watermark.png"
          dotnet tool run api-scripts -- generate-client --service Media

      - name: ⚙️ Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: 📥 Download merged coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: merged-coverage
          path: coverage-reports

      - name: 🔍 Analyze
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SOLUTION: ${{ env.SOLUTION }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- sonarcloud --service-root .

  publish:
    name: 🚀 Publish image
    needs: [unit, functional]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 🔐 Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: 🧱 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 🏷️ Image tags
        id: meta
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "${image}:main" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 🚀 Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            nuget_auth_token=${{ secrets.NUGET_AUTH_TOKEN }}
            sixlabors_license_key=${{ secrets.SIXLABORS_LICENSE_KEY }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

