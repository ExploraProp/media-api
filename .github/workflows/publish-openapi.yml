name: 📄 Publish OpenAPI

on:
  push:
    branches: [main]
    paths:
      - 'src/API/Controllers/**'
      - 'src/Application/Dto/**'
      - 'src/Application/Commands/**'
      - 'src/Application/Queries/**'
      - '.github/workflows/publish-openapi.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.103'
  CONTRACTS_REPO: ExploraProp/openapi-contracts
  INTERNAL_CONTRACTS_REPO: ExploraProp/openapi-contracts-internal
  CONTRACTS_REF: main

jobs:
  publish:
    name: Publish Media OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/ExploraProp/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: 📦 Restore local tools
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          dotnet nuget update source github-exploraprop --username github --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet tool restore

      - name: 🔐 Configure secrets
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- secrets-ci --service Media --format github-env >> "$GITHUB_ENV"

      - name: 📝 Generate OpenAPI
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- generate-openapi --service Media

      - name: 📤 Publish public contracts
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          CONTRACTS_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          CONTRACTS_REPO: ${{ env.CONTRACTS_REPO }}
          CONTRACTS_REF: ${{ env.CONTRACTS_REF }}
          BC: media
        run: |
          set -euo pipefail
          dotnet tool run api-scripts -- publish-contracts

      - name: 📤 Publish internal contracts
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
          CONTRACTS_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          CONTRACTS_REPO: ${{ env.INTERNAL_CONTRACTS_REPO }}
          CONTRACTS_REF: ${{ env.CONTRACTS_REF }}
          BC: media
        run: |
          set -euo pipefail
          if [[ ! -f "docs/openapi/apis/media/openapi.internal.v1.json" ]]; then
            echo "No internal OpenAPI for media; skipping."
            exit 0
          fi
          dotnet tool run api-scripts -- publish-contracts --internal
